baseURL = "https://ovaar.github.io/"
title = "Ovaar - Software engineering blog"
copyright = "2020 Ovaar. This work is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License."
theme = "ovaarian"

enableEmoji=true
enableRobotsTXT = true
# Lastmod (sitemap, dateModified) comes from the last git commit touching the file.
enableGitInfo = true

[taxonomies]
   tag = "tags"
   category = "categories"

[params.social]
    github = "https://github.com/ovaar"
    linkedin = "https://www.linkedin.com/in/thomasreynders/"

[params]
    Author = "Ovaar"
    Description = "Software engineering notes by Thomas Reynders on C++ and Conan, Python tooling, CI pipelines, 3D on the web and working with coding agents."
    ogImage = "og-default.png"
    FullName = "Thomas Reynders"
    Headline = "Notes on building software."
    Motto = "Build. Measure. Improve."
    Intro = "Software engineer from Leeuwarden. I write about 3D on the web, C++ and Python tooling, CI pipelines, and working alongside coding agents. More [about me](/about/)."

[permalinks]
    posts = "/:year/:month/:title/"

[imaging]
    resampleFilter = "box"
    anchor = "smart"
    bgColor = "#ffffff"

[imaging.jpeg]
    quality = 75

[imaging.webp]
    quality = 75
    hint = "photo"

[imaging.exif]
    includeFields = ""
    excludeFields = ""
    disableDate = false
    disableLatLong = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = false
    style = "monokai"
    tabWidth = 4

[caches]
  [caches.images]
    dir = ':cacheDir/images'