baseURL = "https://ovaar.github.io/"
title = "Ovaar - Software engineering blog"
copyright = "© 2020–2026 Thomas Reynders. Licensed under CC BY-NC 4.0: https://creativecommons.org/licenses/by-nc/4.0/"
theme = "ovaarian"

enableEmoji=true
enableRobotsTXT = true
# Lastmod (sitemap, dateModified) comes from the last git commit touching the file.
enableGitInfo = true
[frontmatter]
  # A lastmod in front matter wins over git, for edits that were only metadata.
  lastmod = ["lastmod", ":git", ":default"]

# Related posts at the end of each post: shared tags count most.
[related]
  includeNewer = true
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 60

# /llms.txt is generated from the posts, so it can't drift from what is published.
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "llms"]

[taxonomies]
   tag = "tags"
   category = "categories"

[params.social]
    github = "https://github.com/ovaar"
    linkedin = "https://www.linkedin.com/in/thomasreynders/"

[params]
    Author = "Ovaar"
    Description = "Software engineering notes by Thomas Reynders on C++ and Conan, Python tooling, CI pipelines, 3D on the web and working with coding agents."
    ogImage = "og-default.png"
    # Short label above the homepage headline. Description above is for search results and social cards.
    Tagline = "Software engineering blog"
    FullName = "Thomas Reynders"
    Headline = "Notes on building software."
    Motto = "Build. Measure. Improve."
    Intro = "Software engineer from Leeuwarden. I write about C++ and Python tooling, CI pipelines, working alongside coding agents, and 3D on the web. More [about me](/about/)."

[permalinks]
    posts = "/:year/:month/:title/"

[imaging]
    resampleFilter = "box"
    anchor = "smart"
    bgColor = "#ffffff"

[imaging.jpeg]
    quality = 75

[imaging.webp]
    quality = 75
    hint = "photo"

[imaging.exif]
    includeFields = ""
    excludeFields = ""
    disableDate = false
    disableLatLong = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = false
    style = "monokai"
    tabWidth = 4

[caches]
  [caches.images]
    dir = ':cacheDir/images'