{{- /* Responsive image from assets/. Serves a resized WebP (never the original), with
       width/height to prevent layout shift and lazy loading. Remote and GIF sources pass through. */ -}}
{{- $srcArg := .Get "src" -}}
{{- $alt := .Get "alt" | default "" -}}
<div class="center">
<figure>
{{- if hasPrefix $srcArg "http" -}}
<img src="{{ $srcArg }}" alt="{{ $alt }}" loading="lazy" decoding="async">
{{- else -}}
{{- $src := resources.GetMatch (strings.TrimPrefix "/" $srcArg) | default (resources.GetMatch $srcArg) -}}
{{- if not $src -}}{{- errorf "img shortcode: %q not found in assets/ (%s)" $srcArg .Position -}}{{- end -}}
{{- if eq $src.MediaType.SubType "gif" -}}
<img src="{{ $src.RelPermalink }}" alt="{{ $alt }}" width="{{ $src.Width }}" height="{{ $src.Height }}" loading="lazy" decoding="async">
{{- else -}}
{{- $srcset := slice -}}
{{- $fallback := $src -}}
{{- range slice 480 800 1200 1600 -}}
  {{- if le . $src.Width -}}
    {{- $r := $src.Resize (printf "%dx webp" .) -}}
    {{- $srcset = $srcset | append (printf "%s %dw" $r.RelPermalink .) -}}
    {{- if le . 1200 }}{{ $fallback = $r }}{{ end -}}
  {{- end -}}
{{- end -}}
{{- if eq $fallback $src }}{{ $fallback = $src.Resize (printf "%dx webp" $src.Width) }}{{ end -}}
<img src="{{ $fallback.RelPermalink }}"{{ with $srcset }} srcset="{{ delimit . ", " }}"{{ end }}
  sizes="{{ .Get "sizes" | default "(min-width: 760px) 720px, 100vw" }}"
  width="{{ $fallback.Width }}" height="{{ $fallback.Height }}" alt="{{ $alt }}" loading="lazy" decoding="async">
{{- end -}}
{{- end -}}
{{- with $alt -}}<figcaption>{{ . }}</figcaption>{{- end -}}
</figure>
</div>
