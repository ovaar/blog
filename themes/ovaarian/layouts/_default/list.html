{{ define "main" }}
{{- $posts := where .Site.RegularPages "Type" "post" }}
<div class="page">
  <header class="page-head">
    <p class="eyebrow">Archive<span class="sep">·</span>{{ len $posts }} posts</p>
    <h1>Blog</h1>
    <p>{{ .Site.Params.Intro | markdownify }}</p>
  </header>
  {{ partial "post-list.html" $posts }}
</div>
{{ end }}
