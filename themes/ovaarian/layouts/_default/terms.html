{{ define "main" }}
<div class="page">
  <header class="page-head">
    <p class="eyebrow">Index<span class="sep">·</span>{{ len .Data.Terms }} {{ .Data.Plural }}</p>
    <h1>Topics</h1>
  </header>
  <div class="tags topic-cloud" style="margin-top: 40px">
    {{- range .Data.Terms.Alphabetical }}
    <a class="tag" href="{{ .Page.RelPermalink }}">{{ .Term }}<sup>{{ .Count }}</sup></a>
    {{- end }}
  </div>
</div>
{{ end }}
