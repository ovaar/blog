<nav class="foot-icons" aria-label="Elsewhere">
  {{- range $platform, $url := .Site.Params.Social }}
  <a class="icon-btn" href="{{ $url }}" rel="me noopener" aria-label="{{ if eq $platform "github" }}GitHub{{ else if eq $platform "linkedin" }}LinkedIn{{ else }}{{ $platform | title }}{{ end }}">{{ partial "icon.html" $platform }}</a>
  {{- end }}
  {{- with .Site.Home.OutputFormats.Get "RSS" }}
  <a class="icon-btn" href="{{ .RelPermalink }}" aria-label="RSS feed">{{ partial "icon.html" "rss" }}</a>
  {{- end }}
</nav>
